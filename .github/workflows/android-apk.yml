name: Android Diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android-apk:
    name: Self-contained Debug APK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CHINGU_SELF_CONTAINED_DEBUG: "true"
      EXPO_PUBLIC_BACKEND_URL: "https://chingu-mobile-dev.preview.emergentagent.com"
      EXPO_PUBLIC_STARTUP_BYPASS: "false"
      EXPO_PUBLIC_STARTUP_DIAGNOSTICS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JavaScript dependencies
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            echo "yarn.lock not found — installing without frozen lockfile"
            yarn install
          fi

      - name: Verify embedded vector fonts
        run: |
          test -s assets/fonts/ionicons.ttf
          test -s assets/fonts/feather.ttf
          test -s assets/fonts/material.ttf
          test -s android/app/src/main/assets/fonts/ionicons.ttf
          test -s android/app/src/main/assets/fonts/feather.ttf
          test -s android/app/src/main/assets/fonts/material.ttf

      - name: Generate temporary debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Ensure Gradle wrapper jar
        run: |
          set -euo pipefail
          JAR=android/gradle/wrapper/gradle-wrapper.jar
          if [ -s "$JAR" ]; then
            echo "Gradle wrapper jar present ($(wc -c < "$JAR") bytes)"
            exit 0
          fi
          echo "gradle-wrapper.jar missing — regenerating from official Gradle distribution"
          GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-bin\.zip/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Could not determine Gradle version from gradle-wrapper.properties"
            exit 1
          fi
          echo "Target Gradle version: ${GRADLE_VERSION}"
          curl -fL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          ( cd android && "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}" )
          test -s "$JAR"
          echo "Regenerated wrapper jar ($(wc -c < "$JAR") bytes)"

      - name: Build self-contained debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify JS bundle is embedded in APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "Inspecting $APK"
          unzip -l "$APK" | grep -E "assets/index\.android\.bundle" || {
            echo "::error::index.android.bundle is MISSING from the APK. selfContainedDebug bundling did not run. Debug APK will white-screen because it will try to reach Metro on the device."
            unzip -l "$APK" | head -80
            exit 1
          }
          BUNDLE_SIZE=$(unzip -p "$APK" assets/index.android.bundle | wc -c)
          echo "Embedded JS bundle size: ${BUNDLE_SIZE} bytes"
          if [ "$BUNDLE_SIZE" -lt 100000 ]; then
            echo "::error::index.android.bundle is suspiciously small (${BUNDLE_SIZE} bytes). Expected >100KB."
            exit 1
          fi
          echo "::notice::APK contains a valid embedded JS bundle (${BUNDLE_SIZE} bytes)."

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: chingu-speak-diagnostic-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
